<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#181713">
<title>Page Not Found — Appalachian Vanguard</title>
<meta name="robots" content="noindex">

<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="alternate icon" href="assets/favicon.ico">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Serif+4:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark light;
    --bg: #181713;
    --text: #ece4d2;
    --text-muted: #b7c2b8;
    --text-eyebrow: #d9a94c;
    --accent: #d9b23c;
    --surface: #33523f;
    --surface-hover: #3f6350;
    --on-surface: #f2ead9;
    --line: rgba(255,255,255,0.14);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eae3d2;
      --text: #1c1b18;
      --text-muted: #2f4538;
      --text-eyebrow: #7a5a3c;
      --accent: #c9a227;
      --surface: #23362a;
      --surface-hover: #2f4538;
      --on-surface: #eae3d2;
      --line: rgba(28,27,24,0.14);
    }
  }
  * { box-sizing: border-box; }
  html, body { background-color: var(--bg); }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    color: var(--text);
    font-family: 'Source Serif 4', serif;
    font-size: 18px;
    line-height: 1.6;
  }
  .wrap { max-width: 480px; }
  .eyebrow {
    display: block;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-eyebrow);
    margin-bottom: 14px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(32px, 6vw, 46px);
    margin: 0 0 16px;
  }
  p { color: var(--text-muted); margin: 0 0 28px; }
  .home-link {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.03em;
    text-decoration: none;
    padding: 12px 22px;
    background: var(--surface);
    color: var(--on-surface);
    border-radius: 3px;
    display: inline-block;
  }
  .home-link:hover { background: var(--surface-hover); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
  <div class="wrap">
    <span class="eyebrow">404</span>
    <h1>This trail runs out here.</h1>
    <p>The page you're looking for doesn't exist or may have moved.</p>
    <a class="home-link" href="/">Back to the homepage &rarr;</a>
  </div>
</body>
</html>
